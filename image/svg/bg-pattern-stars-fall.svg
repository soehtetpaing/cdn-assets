  <!-- use all diagonal falling lines -->
  <use href="#fallLine1"/>
  <use href="#fallLine2"/>
  <use href="#fallLine3"/>
  <use href="#fallLine4"/>
  <use href="#fallLine5"/>
  <use href="#fallLine6"/>
