      <animate attributeName="x1" values="30;-40" dur="4.2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="y1" values="-10;70" dur="4.2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="x2" values="17;-53" dur="4.2s" repeatCount="indefinite" begin="0.7s"/>
