<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 50 50">
  <defs>
    <!-- diagonal line 1 -->
    <line id="fallLine1" x1="55" y1="0" x2="49" y2="6" stroke="rgba(99, 102, 241, 0.3)" stroke-width="0.6" stroke-linecap="round">
      <animate attributeName="x1" values="65;-5" dur="3.6s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="y1" values="-10;70" dur="3.6s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="x2" values="59;-11" dur="3.6s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="y2" values="-4;76" dur="3.6s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="3.6s" repeatCount="indefinite" begin="1s"/>
    </line>
    
    <!-- diagonal line 2 -->
    <line id="fallLine2" x1="45" y1="0" x2="33" y2="12" stroke="rgba(236, 72, 153, 0.3)" stroke-width="0.7" stroke-linecap="round">
      <animate attributeName="x1" values="55;-15" dur="4.4s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="y1" values="-10;70" dur="4.4s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="x2" values="43;-27" dur="4.4s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="y2" values="2;82" dur="4.4s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="0;0.4;0" dur="4.4s" repeatCount="indefinite" begin="0.3s"/>
    </line>
    
    <!-- diagonal line 3 -->
