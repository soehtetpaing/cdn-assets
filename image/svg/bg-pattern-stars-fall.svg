      <animate attributeName="y1" values="-10;70" dur="5.4s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="x2" values="28;-42" dur="5.4s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="y2" values="-3;77" dur="5.4s" repeatCount="indefinite" begin="0.8s"/>
