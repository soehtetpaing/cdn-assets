      <animate attributeName="y1" values="-10;70" dur="6.4s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="x2" values="63;-7" dur="6.4s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="y2" values="-5;75" dur="6.4s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0;0.35;0" dur="6.4s" repeatCount="indefinite" begin="2s"/>
    </line>
    
    <!-- diagonal line 5 -->
    <line id="fallLine5" x1="48" y1="0" x2="37" y2="11" stroke="rgba(99, 102, 241, 0.3)" stroke-width="0.75" stroke-linecap="round">
      <animate attributeName="x1" values="58;-12" dur="3s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="y1" values="-10;70" dur="3s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="x2" values="47;-23" dur="3s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="y2" values="1;81" dur="3s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="opacity" values="0;0.5;0" dur="3s" repeatCount="indefinite" begin="1.8s"/>
