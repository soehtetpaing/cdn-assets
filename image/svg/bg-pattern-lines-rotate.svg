<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 50 50">
  <defs>
    <pattern id="lines" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="rgba(99, 102, 241, 0.06)" stroke-width="1"/>
      <line x1="15" y1="0" x2="15" y2="30" stroke="rgba(236, 72, 153, 0.04)" stroke-width="0.5"/>
      <animateTransform attributeName="patternTransform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <rect width="60" height="60" fill="url(#lines)"/>
</svg>