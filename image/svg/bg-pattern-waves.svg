<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.05">
        <animate attributeName="stop-opacity" values="0.05;0.1;0.05" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.03">
        <animate attributeName="stop-opacity" values="0.03;0.08;0.03" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <pattern id="hexagon" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 15 L60 45 L30 60 L0 45 L0 15 Z" fill="none" stroke="rgba(99, 102, 241, 0.08)" stroke-width="0.5">
        <animate attributeName="stroke-opacity" values="0.08;0.15;0.08" dur="8s" repeatCount="indefinite"/>
      </path>
      <circle cx="30" cy="30" r="3" fill="rgba(236, 72, 153, 0.1)">
        <animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.1;0.2;0.1" dur="4s" repeatCount="indefinite"/>
      </circle>
    </pattern>
    
    <pattern id="waves" width="100" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q25 0 50 10 T100 10 T150 10 T200 10" fill="none" stroke="rgba(99, 102, 241, 0.06)" stroke-width="0.5">
        <animate attributeName="d" 
          values="M0 10 Q25 0 50 10 T100 10 T150 10 T200 10;
                  M0 10 Q25 20 50 10 T100 10 T150 10 T200 10;
                  M0 10 Q25 0 50 10 T100 10 T150 10 T200 10"
          dur="6s" repeatCount="indefinite"/>
      </path>
    </pattern>
  </defs>
  
  <rect width="200" height="200" fill="url(#grad1)"/>
  <rect width="200" height="200" fill="url(#hexagon)"/>
  <rect width="200" height="200" fill="url(#waves)"/>
  
  <!-- Floating particles -->
  <circle cx="50" cy="50" r="2" fill="rgba(99, 102, 241, 0.15)">
    <animate attributeName="cy" values="50;40;50" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="50;55;50" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="100" r="1.5" fill="rgba(236, 72, 153, 0.12)">
    <animate attributeName="cy" values="100;90;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="150;155;150" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="150" r="1" fill="rgba(99, 102, 241, 0.1)">
    <animate attributeName="cy" values="150;140;150" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="30" r="1.5" fill="rgba(236, 72, 153, 0.1)">
    <animate attributeName="cx" values="180;185;180" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>